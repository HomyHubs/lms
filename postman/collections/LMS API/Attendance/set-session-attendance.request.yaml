$kind: http-request
name: Set session attendance
method: PUT
url: '{{base_url}}/sessions/:id/attendance'
order: 10000
description: Replace the attendance records for a session.
pathVariables:
  - key: id
    value: '1'
    description: Session id
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "records": []
    }
