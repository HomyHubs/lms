$kind: http-request
name: Set question media
method: PUT
url: '{{base_url}}/questions/:id/media'
order: 4000
description: Associate a media item with a question.
pathVariables:
  - key: id
    value: '1'
    description: Question id
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "mediaId": 1
    }
