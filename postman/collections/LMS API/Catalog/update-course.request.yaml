$kind: http-request
name: Update course
method: PATCH
url: '{{base_url}}/courses/:id'
order: 4000
description: Update a course's attributes.
pathVariables:
  - key: id
    value: '1'
    description: Course id
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Beginner English"
    }
