$kind: http-request
name: Forgot password
method: POST
url: '{{base_url}}/auth/forgot-password'
order: 4000
description: Request a password reset OTP via the chosen channel.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "user@example.com",
      "channel": "email"
    }
