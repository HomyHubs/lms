$kind: http-request
name: Reset password
method: POST
url: '{{base_url}}/auth/reset-password'
order: 5000
description: Reset the password using the OTP sent to the user.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "user@example.com",
      "otp": "123456",
      "newPassword": "newPass123"
    }
