name: Auto-merge into dev after approved review

on:
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge eligible PRs targeting dev
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const prs = await github.rest.pulls.list({ owner, repo, state: "open", base: "dev" })
            for (const pr of prs.data) {
              const reviews = await github.rest.pulls.listReviews({ owner, repo, pull_number: pr.number })
              const approved = reviews.data.some(r => r.state === "APPROVED")
              const changesRequested = reviews.data.some(r => r.state === "CHANGES_REQUESTED")
              if (!approved || changesRequested) continue
              const checks = await github.rest.checks.listForRef({ owner, repo, ref: pr.head.sha })
              const allChecksGreen = checks.data.check_runs.every(c => c.status === "completed" && c.conclusion === "success")
              if (!allChecksGreen) continue
              try {
                await github.rest.pulls.merge({ owner, repo, pull_number: pr.number, merge_method: "squash" })
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${pr.head.ref}` })
              } catch (err) {
                core.warning(`Khong the auto-merge PR #${pr.number}: ${err.message}`)
              }
            }

# Yeu cau bo sung trong Settings cua repo GitHub:
# - Bat "Allow auto-merge"
# - Bat "Automatically delete head branches" (du phong neu buoc deleteRef o tren bi bo qua)
# - Branch protection tren "dev": yeu cau status check bat buoc xanh truoc khi merge
