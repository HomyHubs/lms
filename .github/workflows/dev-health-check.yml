# BẮT BUỘC theo AGENTS.md mục 12.4.
# Chạy lại toàn bộ cổng gác (mục 7) mỗi khi có commit mới push vào `dev`,
# để bắt lỗi phát sinh khi nhiều PR song song cộng lại (semantic conflict)
# mà cổng gác chạy riêng trên từng nhánh PR không thấy được.
#
# Workflow này KHÔNG thể tự chặn merge gây ra lỗi (nó chạy sau khi push đã
# xảy ra). Nếu job dưới đây FAIL: dừng merge mọi PR khác vào `dev` ngay,
# tạo nhánh bugfix/dev-health-<mo-ta> sửa ưu tiên cao nhất, chỉ tiếp tục
# merge PR khác sau khi workflow này xanh lại. Xem AGENTS.md mục 12.4.

name: Dev Health Check

on:
  push:
    branches:
      - dev

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      # Cổng gác thực tế của repo (AGENTS.md mục 7): pnpm -r lint && typecheck && test.
      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Cảnh báo nếu FAIL
        if: failure()
        run: |
          echo "::error::dev health-check FAILED sau khi merge vao dev."
          echo "::error::Theo AGENTS.md muc 12.4: DUNG merge PR khac vao dev ngay."
          echo "::error::Tao nhanh bugfix/dev-health-<mo-ta> de sua uu tien cao nhat."
          exit 1
