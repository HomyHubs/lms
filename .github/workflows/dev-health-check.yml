# BẮT BUỘC theo AGENTS.md mục 12.4.
# Chạy lại toàn bộ cổng gác (mục 7) mỗi khi có commit mới push vào `dev`,
# để bắt lỗi phát sinh khi nhiều PR song song cộng lại (semantic conflict)
# mà cổng gác chạy riêng trên từng nhánh PR không thấy được.
#
# Workflow này KHÔNG thể tự chặn merge gây ra lỗi (nó chạy sau khi push đã
# xảy ra). Nếu job dưới đây FAIL: dừng merge mọi PR khác vào `dev` ngay,
# tạo nhánh bugfix/dev-health-<mo-ta> sửa ưu tiên cao nhất, chỉ tiếp tục
# merge PR khác sau khi workflow này xanh lại. Xem AGENTS.md mục 12.4.
#
# 2026-11-26: thêm Postgres thật. Trước đây job này không có DB nên 22 test
# `*.integration.test.ts` (gate theo TEST_DATABASE_URL) bị skip, mà `ci.yml`
# chỉ chạy trên pull_request — nghĩa là mọi commit push thẳng vào `dev` đều
# đi qua cổng gác mà KHÔNG hề chạy test tích hợp.
#
# Nếu DB không lên được thì `dbmate up` fail ngay (job đỏ), nên không cần
# thêm bước "chặn skip" thủ công.

name: Dev Health Check

on:
  push:
    branches:
      - dev
      # TAM THOI: de verify config Postgres tren nhanh rieng truoc khi vao dev.
      - chore/dev-health-check-postgres

jobs:
  health-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms
          POSTGRES_DB: lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms -d lms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://lms:lms@localhost:5432/lms_test?sslmode=disable
      TEST_DATABASE_URL: postgres://lms:lms@localhost:5432/lms_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      # Khong dat `version:` o day — de action doc phien ban tu `packageManager`
      # trong package.json (pnpm@11.24.0), tranh xung dot ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install dbmate
        run: |
          curl -fsSL https://github.com/amacneil/dbmate/releases/download/v2.24.0/dbmate-linux-amd64 -o /tmp/dbmate
          chmod +x /tmp/dbmate
          sudo mv /tmp/dbmate /usr/local/bin/dbmate

      - name: Migrate test database
        run: dbmate --migrations-dir db/migrations up

      - name: Build
        run: pnpm -r build

      # Cổng gác thực tế của repo (AGENTS.md mục 7): pnpm -r lint && typecheck && test.
      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Cảnh báo nếu FAIL
        if: failure()
        run: |
          echo "::error::dev health-check FAILED sau khi merge vao dev."
          echo "::error::Theo AGENTS.md muc 12.4: DUNG merge PR khac vao dev ngay."
          echo "::error::Tao nhanh bugfix/dev-health-<mo-ta> de sua uu tien cao nhat."
          exit 1
