# Cong gac tren PR: build/lint/typecheck/test + Postgres that cho integration exams.
name: CI

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  guard:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms
          POSTGRES_DB: lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms -d lms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://lms:lms@localhost:5432/lms_test?sslmode=disable
      TEST_DATABASE_URL: postgres://lms:lms@localhost:5432/lms_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false
      - name: Rebuild native deps
        run: pnpm rebuild esbuild
      - name: Install dbmate
        run: |
          curl -fsSL https://github.com/amacneil/dbmate/releases/download/v2.24.0/dbmate-linux-amd64 -o /tmp/dbmate
          chmod +x /tmp/dbmate
          sudo mv /tmp/dbmate /usr/local/bin/dbmate
      - name: Migrate test database
        run: dbmate --migrations-dir db/migrations up
      - name: Build
        run: pnpm -r build
      - name: Lint
        run: pnpm -r lint
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test
        run: pnpm -r test
      - name: Verify latest migration rollback and re-apply
        run: |
          dbmate --migrations-dir db/migrations down
          dbmate --migrations-dir db/migrations up
